name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Pushes the preview to gh-pages and comments its link on the PR
permissions:
  contents: write
  pull-requests: write

# One preview run at a time per PR; the latest push wins
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build -- --base=/letra-a-letra/pr-preview/pr-${{ github.event.number }}/

      # Publishes to /pr-preview/pr-<number>/ and removes it when the PR is closed
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
